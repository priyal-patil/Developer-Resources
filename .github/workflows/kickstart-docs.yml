name: Kickstart Docs Automation

on:
  push:
    branches: [main]
    paths:
      - "kickstart-automation/**"
      - ".github/workflows/kickstart-docs.yml"
  schedule:
    # Daily at 05:00 IST. GitHub Actions cron is UTC-only; IST is UTC+5:30 (no DST),
    # so 05:00 IST = 23:30 UTC the previous calendar day.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      kickstarts:
        description: >
          Which kickstart(s) to run: "all", or a space-separated list of names
          from kickstart-automation/config/kickstarts.json (e.g. "nuxt react").
        required: false
        default: "all"

jobs:
  run-kickstarts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kickstart-automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kickstart-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Contentstack CLI
        run: npm install -g @contentstack/cli

      - name: Run kickstart automation
        env:
          CONTENTSTACK_EMAIL: ${{ secrets.CONTENTSTACK_EMAIL }}
          CONTENTSTACK_PASSWORD: ${{ secrets.CONTENTSTACK_PASSWORD }}
          CONTENTSTACK_REGION: ${{ secrets.CONTENTSTACK_REGION }}
          CONTENTSTACK_ORG_NAME: ${{ secrets.CONTENTSTACK_ORG_NAME || 'Contentstack QA' }}
        run: |
          set -e
          KICKSTARTS="${{ github.event.inputs.kickstarts || 'all' }}"
          if [ "$KICKSTARTS" = "all" ]; then
            npm run run-all
          else
            npx tsx src/index.ts $KICKSTARTS
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickstart-reports-${{ github.run_number }}
          path: |
            kickstart-automation/reports/**
          retention-days: 30

      - name: Prepare Slack summary (sent via channel email)
        if: always()
        id: slack_prep
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAS_CHANNEL: ${{ secrets.SLACK_CHANNEL_EMAIL != '' }}
          HAS_FROM: ${{ secrets.ALERT_FROM_EMAIL != '' }}
          HAS_PASS: ${{ secrets.ALERT_EMAIL_PASSWORD != '' }}
        run: |
          set -e
          if [ "$HAS_CHANNEL" != "true" ] || [ "$HAS_FROM" != "true" ] || [ "$HAS_PASS" != "true" ]; then
            echo "Slack alert secrets not fully set — skipping notification."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"

          if [ ! -f reports/latest.json ]; then
            SUBJECT="⚠️ Kickstart Docs Automation — no report generated"
            node -e '
              const fs = require("fs");
              fs.writeFileSync("reports/slack-summary.txt", `No report was generated (the job may have crashed).\n\nView run: ${process.env.RUN_URL}`);
            '
          else
            node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("reports/latest.json", "utf8"));
              const results = data.results || [];
              const passed = results.filter((r) => r.ok).length;
              const failed = results.length - passed;
              const lines = results.map((r) => `${r.ok ? "PASS" : "FAIL"}  ${r.kickstart}`).join("\n");
              const text = [
                `${results.length} checked, ${passed} passed, ${failed} with issues`,
                "",
                lines,
                "",
                `View full report, screenshots & bug-report docs: ${process.env.RUN_URL}`,
              ].join("\n");
              fs.writeFileSync("reports/slack-summary.txt", text);
              const subject = `Kickstart Docs Automation — ${passed}/${results.length} passed`;
              fs.writeFileSync("reports/slack-subject.txt", subject);
            '
            SUBJECT="$(cat reports/slack-subject.txt)"
          fi
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

      # Slack can receive plain email at a channel's email address and posts it
      # as a message — no Slack app/webhook needed. Uses Gmail/Workspace SMTP.
      - name: Send Slack alert via channel email
        if: always() && steps.slack_prep.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_FROM_EMAIL }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          from: ${{ secrets.ALERT_FROM_EMAIL }}
          to: ${{ secrets.SLACK_CHANNEL_EMAIL }}
          subject: ${{ steps.slack_prep.outputs.subject }}
          body: file://kickstart-automation/reports/slack-summary.txt
