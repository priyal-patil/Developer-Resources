name: Kickstart Docs Automation

on:
  push:
    branches: [main]
    paths:
      - "kickstart-automation/**"
      - "building-websites-automation/**"
      - ".github/workflows/kickstart-docs.yml"
  schedule:
    # Daily at 05:00 IST. GitHub Actions cron is UTC-only; IST is UTC+5:30 (no DST),
    # so 05:00 IST = 23:30 UTC the previous calendar day.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      kickstarts:
        description: >
          Which kickstart(s) to run: "all", or a space-separated list of names
          from kickstart-automation/config/kickstarts.json (e.g. "nuxt react").
        required: false
        default: "all"

jobs:
  run-kickstarts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kickstart-automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kickstart-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Contentstack CLI
        run: npm install -g @contentstack/cli

      - name: Run kickstart automation
        env:
          CONTENTSTACK_EMAIL: ${{ secrets.CONTENTSTACK_EMAIL }}
          CONTENTSTACK_PASSWORD: ${{ secrets.CONTENTSTACK_PASSWORD }}
          CONTENTSTACK_REGION: ${{ secrets.CONTENTSTACK_REGION }}
          CONTENTSTACK_ORG_NAME: ${{ secrets.CONTENTSTACK_ORG_NAME || 'Contentstack QA' }}
          # src/api/contentstack.ts sends this as organization_uid; without it
          # the Management API fallbacks (stack lookup, orphan sweep) query the
          # whole account with an empty org and come back useless.
          CONTENTSTACK_ORG_ID: ${{ secrets.CONTENTSTACK_ORG_ID }}
        run: |
          set -e
          KICKSTARTS="${{ github.event.inputs.kickstarts || 'all' }}"
          if [ "$KICKSTARTS" = "all" ]; then
            npm run run-all
          else
            npx tsx src/index.ts $KICKSTARTS
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickstart-reports-${{ github.run_number }}
          path: |
            kickstart-automation/reports/**
          retention-days: 30

      - name: Prepare Slack summary (sent via channel email)
        if: always()
        id: slack_prep
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAS_CHANNEL: ${{ secrets.SLACK_CHANNEL_EMAIL != '' }}
          HAS_FROM: ${{ secrets.ALERT_FROM_EMAIL != '' }}
          HAS_PASS: ${{ secrets.ALERT_EMAIL_PASSWORD != '' }}
        run: |
          set -e
          if [ "$HAS_CHANNEL" != "true" ] || [ "$HAS_FROM" != "true" ] || [ "$HAS_PASS" != "true" ]; then
            echo "Slack alert secrets not fully set — skipping notification."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"

          if [ ! -f reports/latest.json ]; then
            SUBJECT="⚠️ Kickstart Docs Automation — no report generated"
            node -e '
              const fs = require("fs");
              fs.writeFileSync("reports/slack-summary.txt", `No report was generated (the job may have crashed).\n\nView run: ${process.env.RUN_URL}`);
            '
          else
            node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("reports/latest.json", "utf8"));
              const results = data.results || [];
              const passed = results.filter((r) => r.ok).length;
              const failed = results.length - passed;
              const lines = results.map((r) => `${r.ok ? "PASS" : "FAIL"}  ${r.kickstart}`).join("\n");
              const text = [
                `${results.length} checked, ${passed} passed, ${failed} with issues`,
                "",
                lines,
                "",
                `View full report, screenshots & bug-report docs: ${process.env.RUN_URL}`,
              ].join("\n");
              fs.writeFileSync("reports/slack-summary.txt", text);
              const subject = `Kickstart Docs Automation — ${passed}/${results.length} passed`;
              fs.writeFileSync("reports/slack-subject.txt", subject);
            '
            SUBJECT="$(cat reports/slack-subject.txt)"
          fi
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

      # Slack can receive plain email at a channel's email address and posts it
      # as a message — no Slack app/webhook needed. Uses Gmail/Workspace SMTP.
      - name: Send Slack alert via channel email
        if: always() && steps.slack_prep.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_FROM_EMAIL }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          from: ${{ secrets.ALERT_FROM_EMAIL }}
          to: ${{ secrets.SLACK_CHANNEL_EMAIL }}
          subject: ${{ steps.slack_prep.outputs.subject }}
          body: file://kickstart-automation/reports/slack-summary.txt

      - name: Publish report to dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          # The adapter emits one report per kickstart guide (suite
          # "kickstart-<name>") into a staging dir and prints the
          # "<report.json>:<reports-dir>" argument for each, one per line.
          STAGE=/tmp/dashboard-kickstart-stage
          node scripts/publish-to-dashboard.js --stage-dir "$STAGE" > /tmp/kickstart-publish-args.txt
          if [ ! -s /tmp/kickstart-publish-args.txt ]; then
            echo "::error::kickstart adapter staged no reports"
            exit 1
          fi

          git clone https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git /tmp/dashboard-data
          cd /tmp/dashboard-data
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"

          pushed=false
          for i in $(seq 1 10); do
            # Unquoted on purpose: one argument per line, no spaces in paths.
            node scripts/publish.js $(cat /tmp/kickstart-publish-args.txt)
            git add -A
            git commit -m "Publish developer-resources-docs-automation kickstart-* reports ($GITHUB_RUN_ID)" || true
            if git push origin main; then
              pushed=true
              break
            fi
            git fetch origin main
            git reset --hard origin/main
            sleep $(( (RANDOM % 4000 + 1000) * i / 1000 ))
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push dashboard report for kickstart-automation after 10 attempts"
            exit 1
          fi

  # building-websites-automation is a standalone sibling project (own deps,
  # .env, config/docs.json) that inherits kickstart-automation's pipeline
  # contract (parse -> execute verbatim -> verify -> report) but adapts it
  # for the "Building Websites" doc specifically (different section-split
  # depth, region codes, .env.sample naming, etc. - see its own README).
  # It was never folded INTO kickstart-automation's own generic pipeline,
  # since those adaptations would be lost - instead it runs here as its own
  # job in the same workflow, on the same schedule, so it's exercised
  # alongside kickstart-automation without the two pipelines colliding.
  run-building-websites:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: building-websites-automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: building-websites-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Contentstack CLI
        run: npm install -g @contentstack/cli

      - name: Run building-websites automation
        env:
          CONTENTSTACK_EMAIL: ${{ secrets.CONTENTSTACK_EMAIL }}
          CONTENTSTACK_PASSWORD: ${{ secrets.CONTENTSTACK_PASSWORD }}
          CONTENTSTACK_REGION: ${{ secrets.CONTENTSTACK_REGION }}
          CONTENTSTACK_ORG_ID: ${{ secrets.CONTENTSTACK_ORG_ID }}
          AUTOMATE_DASHBOARD: "true"
        run: npm run run-all

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-websites-reports-${{ github.run_number }}
          path: |
            building-websites-automation/reports/**
          retention-days: 30

      - name: Publish report to dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          node scripts/publish-to-dashboard.js > /tmp/dashboard-building-websites-automation.json

          REPORTS_DIR=/tmp/reports-building-websites-automation
          rm -rf "$REPORTS_DIR"
          if [ -f reports/index.html ]; then
            mkdir -p "$REPORTS_DIR"
            cp reports/index.html "$REPORTS_DIR/"
            cp reports/*.png "$REPORTS_DIR/" 2>/dev/null || true
          fi

          git clone https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git /tmp/dashboard-data
          cd /tmp/dashboard-data
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"

          pushed=false
          for i in $(seq 1 10); do
            if [ -d "$REPORTS_DIR" ] && [ -n "$(ls -A "$REPORTS_DIR" 2>/dev/null)" ]; then
              node scripts/publish.js "/tmp/dashboard-building-websites-automation.json:$REPORTS_DIR"
            else
              node scripts/publish.js /tmp/dashboard-building-websites-automation.json
            fi
            git add -A
            git commit -m "Publish developer-resources-docs-automation/building-websites-automation report ($GITHUB_RUN_ID)" || true
            if git push origin main; then
              pushed=true
              break
            fi
            git fetch origin main
            git reset --hard origin/main
            sleep $(( (RANDOM % 4000 + 1000) * i / 1000 ))
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push dashboard report for building-websites-automation after 10 attempts"
            exit 1
          fi
