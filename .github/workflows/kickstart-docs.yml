name: Kickstart Docs Automation

on:
  push:
    branches: [main]
    paths:
      - "kickstart-automation/**"
      - ".github/workflows/kickstart-docs.yml"
  schedule:
    # Every Monday 06:00 UTC — catches drift even when nobody touches the doc/code.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      kickstarts:
        description: >
          Which kickstart(s) to run: "all", or a space-separated list of names
          from kickstart-automation/config/kickstarts.json (e.g. "nuxt react").
        required: false
        default: "all"

jobs:
  run-kickstarts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kickstart-automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kickstart-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Contentstack CLI
        run: npm install -g @contentstack/cli

      - name: Run kickstart automation
        env:
          CONTENTSTACK_EMAIL: ${{ secrets.CONTENTSTACK_EMAIL }}
          CONTENTSTACK_PASSWORD: ${{ secrets.CONTENTSTACK_PASSWORD }}
          CONTENTSTACK_REGION: ${{ secrets.CONTENTSTACK_REGION }}
          CONTENTSTACK_ORG_NAME: ${{ secrets.CONTENTSTACK_ORG_NAME || 'Contentstack QA' }}
        run: |
          set -e
          KICKSTARTS="${{ github.event.inputs.kickstarts || 'all' }}"
          if [ "$KICKSTARTS" = "all" ]; then
            npm run run-all
          else
            npx tsx src/index.ts $KICKSTARTS
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickstart-reports-${{ github.run_number }}
          path: |
            kickstart-automation/reports/**
          retention-days: 30

      - name: Post summary to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi

          if [ ! -f reports/latest.json ]; then
            node -e '
              const payload = { text: `:warning: *Kickstart Docs Automation* — no report was generated (job may have crashed).\n<${process.env.RUN_URL}|View run>` };
              require("fs").writeFileSync("/tmp/slack-payload.json", JSON.stringify(payload));
            '
          else
            node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("reports/latest.json", "utf8"));
              const results = data.results || [];
              const passed = results.filter((r) => r.ok).length;
              const failed = results.length - passed;
              const lines = results.map((r) => `${r.ok ? "✅" : "🔴"} ${r.kickstart}`).join("\n");
              const text = [
                `*Kickstart Docs Automation* — ${results.length} checked, ${passed} passed, ${failed} with issues`,
                lines,
                `<${process.env.RUN_URL}|View full report, screenshots & bug-report docs>`,
              ].join("\n");
              fs.writeFileSync("/tmp/slack-payload.json", JSON.stringify({ text }));
            '
          fi

          curl -sf -X POST -H "Content-Type: application/json" \
            --data @/tmp/slack-payload.json "$SLACK_WEBHOOK_URL"
