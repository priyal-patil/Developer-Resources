name: CLI Docs Automation

on:
  push:
    branches: [main]
    paths:
      - "cli-automation/**"
      - ".github/workflows/cli-docs.yml"
  schedule:
    # Daily, 06:00 IST. GitHub Actions cron is UTC-only; IST is UTC+5:30
    # (no DST), so 06:00 IST = 00:30 UTC. Sits between kickstart-docs.yml's
    # daily 23:30 UTC run and sdk-docs.yml's daily 02:00 UTC run, so the
    # three automations don't create real stacks/apps in the shared QA org
    # at the same time.
    #
    # NOTE: explicitly changed from weekly to daily per request. This
    # suite creates real, heavier resources per run than kickstart does
    # (real stacks, Developer Hub apps, cloned starter-app repos) - if
    # quota/rate-limit errors start showing up in run logs, that's this
    # cadence change, not a new bug; drop back to weekly
    # (`- cron: "30 0 * * 1"`) if so.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      docs:
        description: >
          Which doc(s) to run: "all" (every production doc in
          cli-automation/config/docs.json, excluding *-staging entries),
          or a space-separated list of doc names (e.g. "export-content
          install-the-cli").
        required: false
        default: "all"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.set-matrix.outputs.docs }}
    defaults:
      run:
        working-directory: cli-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build doc matrix
        id: set-matrix
        run: |
          set -e
          INPUT="${{ github.event.inputs.docs || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            DOCS=$(node -e "console.log(JSON.stringify(require('./config/docs.json').docs.filter(d => !d.name.includes('staging')).map(d => d.name)))")
          else
            DOCS=$(node -e "console.log(JSON.stringify(process.argv[1].split(' ').filter(Boolean)))" "$INPUT")
          fi
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"

  run-docs:
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      # Capped rather than fully unbounded: several docs create real
      # stacks/Developer Hub apps in the SAME shared QA org, which has
      # already hit real quota/rate-limit issues from concurrent
      # activity — this caps how many run genuinely simultaneously
      # while still giving most of the parallel-speed benefit.
      max-parallel: 3
      matrix:
        doc: ${{ fromJson(needs.discover.outputs.docs) }}
    defaults:
      run:
        working-directory: cli-automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cli-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Contentstack CLI
        run: npm install -g @contentstack/cli

      - name: Run ${{ matrix.doc }}
        env:
          CONTENTSTACK_EMAIL: ${{ secrets.CONTENTSTACK_EMAIL }}
          CONTENTSTACK_PASSWORD: ${{ secrets.CONTENTSTACK_PASSWORD }}
          CONTENTSTACK_REGION: ${{ secrets.CONTENTSTACK_REGION }}
          CONTENTSTACK_ORG_ID: ${{ secrets.CONTENTSTACK_ORG_ID }}
        run: npm run run-one -- ${{ matrix.doc }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-docs-report-${{ matrix.doc }}-${{ github.run_number }}
          path: |
            cli-automation/reports/**
          retention-days: 30

      - name: Publish report to dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          node scripts/publish-to-dashboard.js > /tmp/dashboard-${{ matrix.doc }}.json

          # This suite is already one-doc-per-suite, so items[]'s single entry
          # just points at the whole doc report file (no anchor needed).
          # Degrades gracefully if reports/index.html wasn't produced.
          REPORTS_DIR=/tmp/reports-${{ matrix.doc }}
          rm -rf "$REPORTS_DIR"
          if [ -f reports/index.html ]; then
            mkdir -p "$REPORTS_DIR"
            cp reports/index.html "$REPORTS_DIR/${{ matrix.doc }}.html"
          fi

          git clone https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git /tmp/dashboard-data
          cd /tmp/dashboard-data
          if [ -d "$REPORTS_DIR" ] && [ -n "$(ls -A "$REPORTS_DIR" 2>/dev/null)" ]; then
            node scripts/publish.js "/tmp/dashboard-${{ matrix.doc }}.json:$REPORTS_DIR"
          else
            node scripts/publish.js /tmp/dashboard-${{ matrix.doc }}.json
          fi
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish developer-resources-docs-automation/${{ matrix.doc }} report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
